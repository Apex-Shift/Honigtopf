<!DOCTYPE html>
<html><head><title>NETGEAR Router Login</title>
<style>body{background:#dfdfdf;font-family:Tahoma;text-align:center;margin-top:15%}
.box{background:#fff;border:2px solid #5a5a5a;padding:25px;width:350px;display:inline-block}
.title{font-size:18px;font-weight:bold;border-bottom:2px solid #9c27b0;padding-bottom:10px;margin-bottom:15px;text-align:left}
.row{margin:12px 0;text-align:left}.row label{display:inline-block;width:100px;font-size:13px}
input[type=text],input[type=password]{width:200px;padding:3px;border:1px solid #7f7f7f}
input[type=submit]{background:#e0e0e0;border:1px solid #7f7f7f;padding:4px 15px;cursor:pointer}</style></head>
<body><div class="box"><div class="title">NETGEAR Smart Wizard Login</div>
<form method="POST" action="/cgi-bin/login.cgi">
<div class="row"><label>User Name:</label><input type="text" name="username" value="admin"></div>
<div class="row"><label>Password:</label><input type="password" name="password"></div>
<div style="text-align:right;margin-top:15px"><input type="submit" value="OK"></div></form></div></body></html>
