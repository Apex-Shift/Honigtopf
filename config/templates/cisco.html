<!DOCTYPE html>
<html>
<head>
    <title>Cisco Systems Router Login</title>
    <style>
        body { background-color: #f7f7f7; font-family: Arial, sans-serif; text-align: center; margin-top: 10%; color: #333; }
        .cisco-box { background: white; border: 1px solid #b5b5b5; border-top: 5px solid #005c84; padding: 25px; width: 380px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); }
        .logo-cisco { font-weight: bold; font-size: 26px; color: #005c84; margin-bottom: 20px; letter-spacing: 1px; }
        .field { margin: 15px 0; text-align: left; }
        .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="password"] { width: 93%; padding: 8px; border: 1px solid #ccc; font-size: 14px; border-radius: 3px; }
        .btn-container { text-align: right; margin-top: 20px; }
        input[type="submit"] { background: #005c84; color: white; border: none; padding: 8px 20px; cursor: pointer; font-size: 13px; border-radius: 3px; font-weight: bold; }
        input[type="submit"]:hover { background: #004564; }
        .alert-text { font-size: 11px; color: #666; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="cisco-box">
        <div class="logo-cisco">CISCO SYSTEMS</div>
        <form method="POST" action="/level/15/exec/-/configure/http">
            <div class="field">
                <label>User Name:</label>
                <input type="text" name="username" placeholder="cisco" required>
            </div>
            <div class="field">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>
            <div class="btn-container">
                <input type="submit" value="Access Device">
            </div>
        </form>
        <div class="alert-text">Authorized Personnel Only - Cisco IOS Management Console</div>
    </div>
</body>
</html>
