<!DOCTYPE html>
<html><head><title>Cisco Systems Router Login</title>
<style>body{background:#f7f7f7;font-family:Arial;text-align:center;margin-top:10%}
.box{background:#fff;border:1px solid #b5b5b5;border-top:5px solid #005c84;padding:25px;width:380px;display:inline-block}
.logo{font-weight:bold;font-size:26px;color:#005c84;margin-bottom:20px}
.field{margin:15px 0;text-align:left}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
input[type=text],input[type=password]{width:93%;padding:8px;border:1px solid #ccc}
input[type=submit]{background:#005c84;color:#fff;border:none;padding:8px 20px;cursor:pointer;float:right}</style></head>
<body><div class="box"><div class="logo">CISCO SYSTEMS</div>
<form method="POST" action="/level/15/exec">
<div class="field"><label>User Name:</label><input type="text" name="username"></div>
<div class="field"><label>Password:</label><input type="password" name="password"></div>
<input type="submit" value="Access Device"></form>
<p style="font-size:11px;color:#666;margin-top:20px;clear:both">Authorized Personnel Only</p></div></body></html>
