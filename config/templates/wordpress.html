<!DOCTYPE html>
<html><head><title>Log In ‹ WordPress</title>
<style>body{background:#f0f0f1;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding-top:8%}
.box{background:#fff;padding:30px;display:inline-block;width:320px;box-shadow:0 1px 3px rgba(0,0,0,.13);border-radius:4px}

<body><div class="box"><h1>WordPress</h1>
<form method="POST" action="/wp-login.php">
