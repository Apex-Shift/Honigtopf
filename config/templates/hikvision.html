<!DOCTYPE html>
<html><head><title>Hikvision Device Login</title>
<style>body{background:#1a1a1a;color:#fff;font-family:Arial;text-align:center;padding-top:10%}
.box{border:1px solid #333;padding:30px;display:inline-block;background:#262626;border-radius:4px}
.logo{color:#e65c00;font-size:24px;font-weight:bold;margin-bottom:20px}
input{width:200px;padding:8px;margin:10px 0;border:1px solid #444;background:#111;color:#fff}
input[type=submit]{background:#e65c00;color:#fff;border:none;padding:10px;width:100%;cursor:pointer;font-weight:bold}</style></head>
<body><div class="box"><div class="logo">HIKVISION</div>
<form method="POST" action="/doc/page/login.asp">
<input type="text" name="username" placeholder="User Name (admin)" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<input type="submit" value="Login"></form></div></body></html>
