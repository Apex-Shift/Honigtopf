<!DOCTYPE html>
<html>
<head>
    <title>Hikvision Device Login</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 10%; }
        .login-box { border: 1px solid #333; padding: 30px; display: inline-block; background: #262626; border-radius: 4px; box-shadow: 0px 0px 15px rgba(0,0,0,0.5); }
        input[type="text"], input[type="password"] { width: 200px; padding: 8px; margin: 10px 0; border: 1px solid #444; background: #111; color: #fff; }
        input[type="submit"] { background: #e65c00; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; }
        input[type="submit"]:hover { background: #ff751a; }
        .logo { color: #e65c00; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">HIKVISION</div>
        <form method="POST" action="/doc/page/login.asp">
            <input type="text" name="username" placeholder="User Name (admin)" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
