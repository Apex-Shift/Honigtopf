version: "3.8"

services:
  honigtopf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honigtopf_v4_core
    restart: unless-stopped
    
    # Reroutage des ports standards (Hôte -> Conteneur)
    ports:
      - "80:8080"     # HTTP Standard
      - "23:2323"     # Telnet Standard
      - "21:2121"     # FTP Standard
      - "445:4455"    # SMB Standard
      - "127.0.0.1:8050:8050" # Dashboard Plotly (Localhost uniquement)

    # Volumes persistants
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./reports:/app/reports

    # Isolation des ressources (Capping contre les DoS)
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

    # Contrôle de santé automatique (Healthcheck)
    healthcheck:
      test: ["CMD-SHELL", "python cli.py status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC